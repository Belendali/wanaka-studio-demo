<meta charset="utf-8">
<title>Wanaka Studio · Plan B</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Bitcount+Grid+Single&display=swap">
<style>
  /* ============ Figma tokens (Wanaka Studio, 0902/0903) ============ */
  :root {
    --bg: #140e10;          /* app ground */
    --panel: #272123;       /* raised tiles */
    --brand: #c0f000;       /* 主色 */
    --ink: #222;            /* 主色2 */
    --white: #fff;          /* 主色3 */
    --w08: rgba(255,255,255,.08);
    --w06: rgba(255,255,255,.06);
    --w05: rgba(255,255,255,.05);
    --w02: rgba(255,255,255,.02);
    --w14: rgba(255,255,255,.14);
    --w20: rgba(255,255,255,.2);
    --w32: rgba(255,255,255,.32);
    --w60: rgba(255,255,255,.6);
    --w65: rgba(255,255,255,.65);
    --w80: rgba(255,255,255,.8);
    --font: 'Poppins', 'Helvetica Neue', Arial, sans-serif;
    --mono: 'Bitcount Grid Single', 'Courier New', monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #2b2b2b; color: var(--white); font-family: var(--font); }
  p { margin: 0; }
  img { display: block; }

  /* ---------- screen picker (outside the 1920x1080 frame) ---------- */
  .picker {
    display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
    padding: 10px 16px; background: #1c1c1c; border-bottom: 1px solid #333;
    font-size: 12px; color: #aaa; position: sticky; top: 0; z-index: 10;
  }
  .picker .lbl { margin-right: 6px; letter-spacing: .04em; text-transform: uppercase; font-size: 11px; color: #777; }
  .picker button {
    font: 500 12px/1 var(--font); color: #ccc; background: #2a2a2a; border: 1px solid #3a3a3a;
    border-radius: 6px; padding: 7px 10px; cursor: pointer;
  }
  .picker button:hover { background: #333; }
  .picker button[aria-pressed="true"] { background: var(--brand); color: #1a1a1a; border-color: var(--brand); }
  .picker button:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
  .picker .zoom { margin-left: auto; font-variant-numeric: tabular-nums; color: #777; }

  .stage-wrap { padding: 16px; overflow: hidden; }
  .stage-box { position: relative; margin: 0 auto; }
  .stage {
    position: absolute; left: 0; top: 0; width: 1920px; height: 1080px;
    background: var(--bg); overflow: hidden; transform-origin: 0 0;
    box-shadow: 0 8px 40px rgba(0,0,0,.5);
  }

  /* ============================ TOP BAR ============================ */
  .topbar { position: absolute; left: 0; top: 0; width: 1920px; height: 44px; background: var(--bg);
    box-shadow: inset 0 -1px 0 0 var(--w08); }
  .tb-left { position: absolute; left: 12px; top: 9px; height: 26px; display: flex; align-items: center; gap: 12px; }
  .tb-center { position: absolute; left: 781.5px; top: 9px; height: 26px; display: flex; align-items: center; gap: 24px; }
  .tb-right { position: absolute; left: 1429px; top: 9px; height: 26px; width: 479px; display: flex; align-items: center; gap: 94px; }
  .iconbtn { display: flex; align-items: center; justify-content: center; }
  .home { width: 32px; height: 26px; border-radius: 8px; background: var(--w08); }
  .vdiv { width: 1px; height: 16px; background: var(--w08); }
  .scenes { display: flex; align-items: center; gap: 8px; }
  .scene { height: 26px; padding: 6px 8px; border-radius: 8px; display: flex; align-items: center; gap: 4px;
    font: 400 14px/14px var(--font); color: var(--w60); white-space: nowrap; }
  .scene.on { background: var(--w08); color: var(--white); }
  .tools { display: flex; align-items: center; gap: 4px; }
  .tgroup { display: flex; align-items: center; }
  .tool { width: 26px; height: 26px; border-radius: 8.667px; display: flex; align-items: center; justify-content: center; opacity: .6; }
  .tool.on { background: var(--w08); opacity: 1; }
  .preview { height: 26px; padding: 6px 8px; border-radius: 8px; background: var(--w08); display: flex; align-items: center; gap: 8px;
    font: 500 14px/16px var(--font); color: var(--white); }
  .publish { position: relative; height: 26px; padding: 6px 8px; border-radius: 8px; display: flex; align-items: center; gap: 8px;
    font: 500 14px/16px var(--font); color: var(--ink);
    background: linear-gradient(90deg, #c0f000 0%, #14f000 46.635%, #00f08c 98.077%);
    box-shadow: inset 0 -4px 4px 0 rgba(255,255,255,.12), inset 0 4px 4px 0 rgba(255,255,255,.12); }
  .acct { display: flex; align-items: center; gap: 16px; }
  .upgrade-wrap { height: 26px; padding-right: 8px; border-radius: 8px; background: var(--w08); display: flex; align-items: center; gap: 8px; }
  .upgrade { height: 26px; padding: 6px 8px; border-radius: 8px; background: #fff; display: flex; align-items: center; gap: 8px;
    font: 500 14px/14px var(--font); color: var(--ink);
    box-shadow: inset 0 -4px 4px 0 rgba(255,255,255,.12), inset 0 4px 4px 0 rgba(255,255,255,.12); }
  .coins { display: flex; align-items: center; gap: 4px; font: 400 14px/14px var(--font); color: var(--white); }
  .coins img { width: 14px; height: 14.4px; }
  .hist { width: 116px; height: 26px; padding: 5px 8px; border-radius: 8px; display: flex; align-items: center; justify-content: space-between; }
  .hist .dim { opacity: .6; } .hist .dim img { transform: scaleX(-1); }

  /* ============================ LEFT RAIL ============================ */
  .rail { position: absolute; left: 0; top: 44px; width: 48px; height: 1036px; background: var(--bg);
    padding: 12px 0; display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    box-shadow: inset -1px 0 0 0 var(--w08); }
  .rail-items { display: flex; flex-direction: column; gap: 12px; }
  .rail-item { width: 28px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .rail-item .ic { width: 28px; height: 28px; padding: 6px; border-radius: 7px; }
  .rail-item.on .ic { background: rgba(192,240,0,.08); }
  .rail-item span { font: 300 8px/10px var(--font); color: var(--white); text-align: center; white-space: nowrap; }
  .rail-avatar { width: 28px; height: 28px; border-radius: 8px; overflow: hidden; }
  .rail-avatar img { width: 100%; height: 100%; object-fit: cover; }

  /* ============================ LEFT PANEL ============================ */
  .panel { position: absolute; left: 48px; top: 44px; width: 380px; height: 1036px; padding-top: 16px;
    display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .panel-title { width: 100%; padding: 0 12px 16px; display: flex; align-items: center; justify-content: space-between;
    font: 500 14px/16px var(--font); box-shadow: inset 0 -0.8px 0 0 var(--w08); }
  .cats { width: 380px; height: 220px; padding: 0 12px; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: 8px; }
  .cat { background: var(--panel); border-radius: 10px; padding: 8px 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; opacity: .6; border: 1px solid transparent; }
  .cat.on { opacity: 1; border-color: #fff; }
  .cat .ic { width: 24px; height: 24px; position: relative; }
  .cat .ic img { width: 24px; height: 24px; }
  .cat .ic.char img { position: absolute; width: 15px; height: 19.09px; left: calc(50% + .3px); top: 2.4px; transform: translateX(-50%); }
  .cat span { font: 400 12px/12px var(--font); color: var(--white); text-align: center; }
  .divider { width: 100%; height: 16px; }
  .content { width: 100%; height: 728px; padding: 0 16px; display: flex; flex-direction: column; }
  .content-inner { flex: 1 0 0; min-height: 1px; padding-bottom: 16px; display: flex; flex-direction: column; justify-content: space-between; }
  .sect-title { width: 100%; padding-bottom: 12px; font: 500 16px/16px var(--font); color: var(--white); white-space: nowrap; }
  .tabs { width: 100%; padding: 4px; gap: 4px; border-radius: 12px; background: var(--w06); display: flex; }
  .tab { flex: 1 0 0; height: 32px; padding: 0 18px; border-radius: 9px; display: flex; align-items: center; justify-content: center; border: 1px solid transparent;
    font: 500 14px/18px var(--font); color: rgba(255,255,255,.5); white-space: nowrap; }
  .tab.on { background: var(--w14); border-color: var(--w20); color: var(--white); }
  .form { display: flex; flex-direction: column; gap: 14px; width: 100%; }
  .prompt { width: 100%; height: 132px; border-radius: 14px; background: var(--w05); border: 1px solid var(--w08);
    padding: 16px 12px 12px 18px; display: flex; flex-direction: column; justify-content: space-between;
    font: 400 14px/20px var(--font); color: var(--w32); overflow: hidden; }
  .prompt.filled .txt { color: var(--white); }
  .prompt .count { text-align: right; }
  .prompt .count b { font-weight: 400; color: var(--w60); }
  .prompt:not(.filled) .count b { color: var(--w32); }
  .refbox { width: 100%; height: 124px; border-radius: 14px; border: 1px dashed var(--w08); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    padding: 16px 12px 12px 18px; background: var(--w05); overflow: hidden; }
  .refbox .add { width: 32px; height: 32px; opacity: .5; }
  .refbox .lab { font: 400 14px/20px var(--font); color: var(--w32); text-align: center; }
  .refbox .cnt { font: 400 12px/20px var(--font); color: var(--w20); text-align: center; margin-top: -2px; }
  .refbox.filled { background: transparent; gap: 0; padding: 14px 9px 10px 15px; justify-content: flex-start; align-items: flex-start; }
  .refrow { display: flex; align-items: center; gap: 6px; }
  .refthumb { width: 104px; height: 100px; border-radius: 10px; background: var(--panel); padding: 6px 14px; display: flex; align-items: center; justify-content: center; }
  .refthumb img { width: 92px; height: 85px; object-fit: contain; object-position: bottom; }
  .refthumb.add { background: var(--w02); border: 1px dashed var(--w08); flex-direction: column; gap: 10px; }
  .refthumb.add img { width: 32px; height: 32px; opacity: .5; }
  .refthumb.add span { font: 400 12px/20px var(--font); color: var(--w20); }
  .row { width: 100%; display: flex; align-items: center; justify-content: space-between; }
  .row .lab { font: 400 14px/16px var(--font); color: var(--w60); white-space: nowrap; }
  .ratio { width: 100%; display: flex; align-items: center; gap: 16px; }
  .ratio .lab { font: 400 14px/20px var(--font); color: var(--w60); }
  .select { flex: 1 0 0; padding: 4px; gap: 8px; border-radius: 8px; background: var(--w05); display: flex; align-items: center; }
  .select .opt { flex: 1 0 0; text-align: center; font: 400 14px/15px var(--font); color: var(--w65); }
  .select .opt.on { background: #fff; border-radius: 6px; padding: 8px 0; min-width: 0; font: 500 14px/14px var(--font); color: #1a1517; }
  .seg { padding: 4px; gap: 3px; border-radius: 8px; background: var(--w06); display: flex; }
  .seg .opt { padding: 5px 13px; border-radius: 6px; font: 500 14px/14px var(--font); color: var(--w65); white-space: nowrap; }
  .seg .opt.on { background: #fff; color: #1a1517; }
  .seg.wide { width: 100%; }
  .seg.wide .opt { flex: 1 0 0; text-align: center; color: rgba(255,255,255,.3); }
  .seg.wide .opt.on { color: #1a1517; }
  .toggle { width: 34px; height: 20px; }
  .pose-group { width: 100%; display: flex; flex-direction: column; gap: 10px; }
  .gen { width: 100%; padding: 8px 16px; border-radius: 12px; background: #fff; border: .8px solid #e6e6e6; box-shadow: 0 2.4px 0 #e6e6e6;
    display: flex; justify-content: center; font: 600 14px/24px var(--font); color: var(--ink); }
  .gen.off { opacity: .5; }
  .gen.off span { opacity: .5; }

  /* assets tab */
  .content.assets { gap: 4px; }
  .content.assets .sect-title { padding-bottom: 12px; }
  .assets-body { flex: 1 0 0; min-height: 1px; padding-bottom: 16px; display: flex; flex-direction: column; gap: 16px; width: 100%; }
  .section { width: 100%; padding: 16px; border-radius: 16px; background: var(--w02); display: flex; flex-direction: column; gap: 8px; }
  .sec-head { display: flex; gap: 8px; align-items: flex-start; }
  .sec-head .d { font: 500 14px/1.2 var(--font); color: rgba(255,255,255,.85); }
  .sec-head .t { font: 400 13px/17px var(--font); color: rgba(255,255,255,.85); }
  .badge { padding: 2px 4px; border-radius: 6px; font: 500 12px/12px var(--font); text-align: center; }
  .badge.d2 { background: #f5ec00; color: #3d3500; }
  .badge.d3 { background: var(--brand); color: #313d00; }
  .cards { display: flex; gap: 8px; width: 100%; }
  .cards.pad { padding: 0 12px; }
  .card { flex: 1 0 0; min-width: 1px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .thumb { position: relative; width: 100%; height: 100px; border-radius: 10px; background: var(--panel); display: flex; align-items: center; justify-content: center; padding: 6px; }
  .thumb .dog { width: 92px; height: 85px; object-fit: contain; object-position: bottom; }
  .thumb .spin { width: 40px; height: 40px; }
  .thumb .badge { position: absolute; left: 6px; top: 6px; }
  .thumb .hover { position: absolute; left: 8px; top: 69px; width: 138px; display: flex; align-items: center; justify-content: space-between; }
  .card .name { width: 100%; text-align: center; font: 400 12px/16px var(--font); color: var(--white); }
  .card .name.dim { color: var(--w65); }
  .card .name.lg { font-size: 14px; }

  /* ============================ VIEWPORT ============================ */
  .viewport { position: absolute; left: 428px; top: 44px; width: 1092px; height: 1036px; border-radius: 8px; overflow: hidden; background: #d9d9d9; }
  .viewport img { width: 100%; height: 100%; }

  /* ============================ RIGHT: CHAT ============================ */
  .chat-head { position: absolute; left: 1520px; top: 44px; width: 400px; height: 52.535px; padding: 12px; background: var(--bg);
    display: flex; align-items: center; gap: 10px; box-shadow: inset 1px 0 0 0 var(--w08), inset 0 -1px 0 0 var(--w08); }
  .chat-name { flex: 1 0 0; min-width: 1px; height: 28px; padding: 6px 12px; border-radius: 8px; background: var(--w08); backdrop-filter: blur(20px);
    display: flex; align-items: center; gap: 8px; font: 400 14px/16px var(--font); color: var(--white); }
  .chat-name span { flex: 1 0 0; }
  .chat-plus { height: 28px; padding: 9px 8px; border-radius: 10px; background: var(--w08); display: flex; align-items: center; }
  .chat-body { position: absolute; left: 1520px; top: 96.54px; width: 400px; height: 983.46px; padding: 12px;
    display: flex; flex-direction: column; justify-content: space-between; box-shadow: inset 1px 0 0 0 var(--w08), inset 0 -1px 0 0 var(--w08); }
  .msgs { display: flex; flex-direction: column; align-items: flex-end; gap: 16px; width: 100%; }
  .user-msg { width: 303px; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  .bubble { width: 303px; padding: 8px 12px; border-radius: 8px; background: #fff; backdrop-filter: blur(20px);
    font: 500 14px/21px var(--font); color: var(--ink); }
  .msg-actions { display: flex; gap: 8px; }
  .think { width: 100%; display: flex; flex-direction: column; gap: 12px; }
  .think .lbl { font: 400 14px/21px var(--font); color: #9c9c9c; width: 216px; }
  .deep { position: relative; width: 100%; height: 146px; }
  .deep .bg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .deep .head { position: absolute; left: 2.78%; top: 0; width: 94.56%; height: 32px; }
  .deep .head p { position: absolute; left: 0; top: 9px; font: 400 14px/14px var(--font); color: var(--white); }
  .deep .head img { position: absolute; right: 0; top: 8.46px; width: 16px; height: 16px; transform: scaleY(-1); }
  .deep .body { position: absolute; left: 2.78%; top: 38px; width: 94.44%; font: 400 14px/20px var(--font); color: var(--w60); }
  .step { width: 100%; display: flex; align-items: center; gap: 8px; font: 400 14px/20px var(--font); color: var(--w80); }
  .step img { width: 16px; height: 16px; flex: none; }
  .step.todo { color: var(--white); }
  .step.todo span { opacity: .4; }
  .step span { flex: 1 0 0; min-width: 1px; }
  .composer-area { position: relative; width: 100%; height: 172px; }
  .model-strip { position: absolute; left: 0; top: 20px; width: 100%; padding-bottom: 34px; border-radius: 8px 8px 0 0;
    background: linear-gradient(180deg, rgba(255,255,255,.1) 5.714%, rgba(255,255,255,0) 98.571%); }
  .model-row { height: 28px; padding: 0 12px; display: flex; align-items: center; justify-content: flex-end; gap: 10px;
    font: 400 12px/21px var(--mono); color: var(--w80); white-space: nowrap; font-variation-settings: "CRSV" 0, "ELSH" 0, "ELXP" 0; }
  .composer { position: absolute; left: 0; top: 48px; width: 100%; height: 124px; padding: 12px; border-radius: 8px;
    background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.16); backdrop-filter: blur(20px);
    box-shadow: 0 0 24px 0 rgba(255,255,255,.12); display: flex; flex-direction: column; justify-content: space-between; }
  .composer .ph { font: 400 14px/21px var(--font); color: rgba(255,255,255,.4); }
  .composer .ctl { display: flex; align-items: flex-end; justify-content: space-between; }
  .composer .lft { display: flex; align-items: center; gap: 12px; }
  .cbtn { position: relative; width: 32px; height: 32px; }
  .cbtn .base { position: absolute; inset: 0; width: 32px; height: 32px; }
  .cbtn .plus { position: absolute; left: 25%; top: 25%; width: 50%; height: 50%; }
  .cbtn .stop { position: absolute; left: 50%; top: 50%; width: 18px; height: 18px; border-radius: 7.5px; background: var(--ink); transform: translate(-50%,-50%); }
  .mascot { position: absolute; left: 0; top: 0; width: 26.91%; height: 60px; overflow: hidden; }
  .mascot img { width: 57px; height: 60.8px; object-fit: contain; }

  /* ============================ component board (asset card) ============================ */
  .board { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  .comp-frame { width: 194px; height: 300px; padding: 20px; background: var(--bg); outline: 1px dashed #9747ff; outline-offset: 0; display: flex; flex-direction: column; gap: 20px; }
  .comp-frame .card { width: 154px; flex: none; }
  .comp-frame .thumb { width: 154px; }
  .comp-cap { position: absolute; left: 50%; top: 50%; transform: translate(200px, -150px); font: 400 13px/1.6 var(--font); color: #9c9c9c; width: 260px; }
  .comp-cap b { color: #fff; font-weight: 500; }
  /* ============================ interactive demo additions ============================ */
  .cat.pick, .tab, .select .opt, .seg .opt, .toggle, .gen:not(.off), .refbox, .refthumb.add, .thumb .hover img, .rail-item, .scene, .tool, .cbtn, .chat-plus { cursor: pointer; }
  .cat.pick:hover { opacity: .85; }
  .prompt textarea { flex: 1 0 0; width: 100%; resize: none; border: 0; outline: 0; background: transparent; padding: 0; margin: 0;
    font: 400 14px/20px var(--font); color: var(--white); caret-color: var(--brand); }
  .prompt textarea::placeholder { color: var(--w32); }
  .prompt:focus-within { border-color: var(--w20); }
  .refbox.filled { height: auto; min-height: 124px; }
  .refrow { flex-wrap: wrap; }
  .refthumb { position: relative; }
  .refthumb .rm { position: absolute; right: 4px; top: 4px; width: 18px; height: 18px; border-radius: 9px; background: rgba(0,0,0,.6); color: #fff;
    font: 500 12px/18px var(--font); text-align: center; display: none; }
  .refthumb:hover .rm { display: block; }
  .refthumb img.user { width: 92px; height: 85px; object-fit: contain; }
  .thumb .hover { display: none; }
  .card.done:hover .thumb .hover { display: flex; }
  .card .thumb img.dog.reveal { animation: reveal .45s ease-out both; }
  @keyframes reveal { from { opacity: 0; transform: scale(.92); } to { opacity: 1; transform: none; } }
  .thumb .spin { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .thumb .prog { position: absolute; left: 6px; right: 6px; bottom: 6px; height: 3px; border-radius: 2px; background: var(--w08); overflow: hidden; }
  .thumb .prog i { display: block; height: 100%; width: 0; background: var(--brand); transition: width .4s linear; }
  .gen.busy { pointer-events: none; }
  .gen.busy span { opacity: .6; }
  .assets-body { overflow-y: auto; }
  .assets-body::-webkit-scrollbar { width: 0; }
  .empty { width: 100%; padding: 48px 16px; text-align: center; font: 400 13px/20px var(--font); color: var(--w32); }
  .toast { position: absolute; left: 974px; bottom: 32px; transform: translateX(-50%) translateY(8px); padding: 8px 14px; border-radius: 8px;
    background: rgba(20,14,16,.92); color: #fff; font: 500 13px/18px var(--font); box-shadow: 0 4px 16px rgba(0,0,0,.4); opacity: 0; transition: .25s; pointer-events: none; }
  .toast.show { opacity: 1; transform: translateX(-50%); }
  .composer textarea { width: 100%; resize: none; border: 0; outline: 0; background: transparent; padding: 0; font: 400 14px/21px var(--font); color: #fff; height: 42px; }
  .composer textarea::placeholder { color: rgba(255,255,255,.4); }
  .fav.on { filter: drop-shadow(0 0 0 #c0f000) brightness(1.4) sepia(1) hue-rotate(40deg) saturate(6); }
  @media (prefers-reduced-motion: reduce) { .thumb .spin, .card .thumb img.dog.reveal { animation: none; } }

  /* ============================ detail modal (2D detail) ============================ */
  .overlay { position: absolute; left: -3px; top: -2px; width: 1923px; height: 1082px; background: rgba(0,0,0,.7); backdrop-filter: blur(5px); z-index: 20; }
  .modal { position: absolute; left: 510px; top: 240px; width: 900px; height: 600px; padding: 24px; border-radius: 20px; background: var(--bg);
    display: flex; flex-direction: column; align-items: center; justify-content: space-between; z-index: 21; }
  .modal .sec-head { width: 100%; }
  .modal .mid { display: flex; align-items: center; justify-content: center; gap: 100px; }
  .modal .nav { width: 40px; height: 40px; cursor: pointer; display: flex; align-items: center; justify-content: center; border-radius: 20px; }

<script>
const A = 'assets/';
const U = (n) => A + n;
const I = (n, w, h, extra='') => `<img src="${A}${n}" width="${w}" height="${h}" style="width:${w}px;height:${h}px" alt="" ${extra}>`;
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------------- state ---------------- */
const KINDS = { '2D & UI': '2D', '3D Model': '3D', 'Character': '3D' };
const ART = { '2D & UI': { thumb: 'dog.png', large: 'dog-large.png' }, '3D Model': { thumb: 'dog.png', large: 'dog-large.png' }, 'Character': { thumb: 'cat.png', large: 'cat-turn.webp' } };
const art = () => ART[S.cat];
const PUPPIES = ['puppy1.png','puppy2.png','puppy3.png','puppy4.png'];
const itemArt = (item) => S.cat === '2D & UI' && item && item.img ? { thumb: item.img, large: item.img } : art();
const freshForm = (cat) => cat === '2D & UI'
  ? { text: '', refs: [], ratio: '1:1', variants: 4, nineSlice: false, transparent: false }
  : { text: '', refs: [], split: false, texture: false, pose: false, poseType: 'A-Pose' };
const freshState = () => ({
  cat: '2D & UI', tab: 'gen', busy: false,
  forms: { '2D & UI': freshForm('2D & UI'), '3D Model': freshForm('3D Model'), 'Character': Object.assign(freshForm('Character'), { text: 'I want to create a cat student', refs: [U('cat.png')], pose: true, poseType: 'T-Pose' }) },
  assets: { '2D & UI': [], '3D Model': [], 'Character': [] },

let S = freshState();

/* ---------------- shared shell ---------------- */
const topbar = () => `
<div class="topbar">

  </div>
  <div class="tb-center">
    <div class="tools">
      <div class="tgroup">

const rail = () => `
<div class="rail">

const viewport = () => `<div class="viewport" id="viewport">${I('viewport.png',1092,1036)}<div class="scene-layer" id="scene"></div></div><div class="toast" id="toast"></div>`;

const chatA = () => `
<div class="chat-head">
  <div class="chat-name"><span>Chat name Chat...</span>${I('chevron-down.svg',16,16)}</div>
  <div class="chat-plus">${I('plus.svg',12,12)}</div>
</div>
<div class="chat-body">
  <div class="msgs">
    <div class="user-msg">
      <div class="bubble">I want to create a Jump Jump game </div>
      <div class="msg-actions">${I('msg-copy.svg',16,16)}${I('msg-edit.svg',16,16)}</div>
    </div>
    <div class="think">
      <p class="lbl">Thinking...</p>
      <div class="deep">
        ${I('think-box.svg',376,146,'class="bg"')}
        <div class="head"><p>Deep Thinking...</p>${I('chevron-up.svg',16,16)}</div>
        <div class="body"><p>Welcome to Wanaka Studio! It's great to have you here.</p><p>To get started on your game development journey, could you tell me a bit more about what you'd like to build?</p></div>
      </div>
      <div class="step">${I('check.svg',16,16)}<span>Search assets for player and platforms</span></div>
      <div class="step todo">${I('step-refresh.svg',16,16)}<span>Declare objects, behaviors, scene config,instances</span></div>
      <div class="step todo">${I('step-dot.svg',16,16)}<span>Write game logic (charging,jumping,platform spawning, scoring)</span></div>

  </div>
  <div class="composer-area">
    <div class="model-strip"><div class="model-row">Wanaka 1.0 Lite ${I('green-dot.svg',6,6)}</div></div>
    <div class="composer">
      <textarea placeholder="Ask, plan, build anything..." aria-label="Chat"></textarea>
      <div class="ctl">
        <div class="lft">
          <div class="cbtn">${I('btn-circle.svg',32,32,'class="base"')}${I('plus-line.svg',16,16,'class="plus"')}</div>
          <div class="cbtn">${I('add-file-2.svg',32,32,'class="base"')}</div>

      </div>
    </div>
    <div class="mascot">${I('mascot.png',57,60.8)}</div>

</div>`;

/* ---------------- left panel ---------------- */
const CATS = [
  ['Character','cat-character.svg','char'], ['2D & UI','cat-image.svg'], ['3D Model','cat-asset.svg'],
  ['Audio','cat-audio.svg'], ['Animation','cat-animation.svg'], ['World','cat-world.svg'],
  ['VFX','cat-vfx.svg'], ['Material','cat-material.svg'], ['Prefab','cat-prefab.svg'],
];
const cats = () => `<div class="cats">${CATS.map(([n,f,k]) =>
  `<div class="cat${n===S.cat?' on':''}${KINDS[n]?' pick':''}" data-act="cat" data-v="${esc(n)}"><div class="ic${k?' '+k:''}">${k ? `<img src="${U(f)}" alt="">` : I(f,24,24)}</div><span>${esc(n)}</span></div>`).join('')}</div>`;

const panelHead = () => `<div class="panel-title"><span>Create</span>${I('sidebar-toggle.svg',16,16)}</div>`;
const tabs = () => `<div class="tabs"><div class="tab${S.tab==='gen'?' on':''}" data-act="tab" data-v="gen">Generate</div><div class="tab${S.tab==='assets'?' on':''}" data-act="tab" data-v="assets">My Assets</div></div>`;
const titleOf = (cat) => cat === '2D & UI' ? 'Create 2D &amp; UI' : cat === '3D Model' ? 'Create 3D Model' : 'Create 3D Character';
const promptBox = (f, ph) => `<div class="prompt${f.text?' filled':''}">
  <textarea id="prompt" maxlength="800" placeholder="${ph}" aria-label="${ph}">${esc(f.text)}</textarea>
  <p class="count"><b id="count">${f.text.length || 0}</b>/800</p></div>`;
const refbox = (f) => f.refs.length
  ? `<div class="refbox filled" data-act="addref"><div class="refrow">
      ${f.refs.map((src, i) => `<div class="refthumb" data-stop="1"><img class="user" src="${src}" alt=""><span class="rm" data-act="rmref" data-v="${i}">×</span></div>`).join('')}
      ${f.refs.length < 5 ? `<div class="refthumb add">${I('add-image.png',32,32)}<span>(${f.refs.length}/5)</span></div>` : ''}</div>${f.refs.length >= 5 ? `<p class="refcap">5/5 reference images · remove one to add another</p>` : ''}</div>`
  : `<div class="refbox" data-act="addref">${I('add-image.png',32,32,'class="add"')}<p class="lab">Add reference images</p><p class="cnt">(0/5)</p></div>`;
const toggle = (label, key, on) => `<div class="row"><span class="lab">${label}</span>${I(on?'toggle-on.svg':'toggle-off.svg',34,20,`class="toggle" data-act="toggle" data-v="${key}"`)}</div>`;
const ratio = (f) => `<div class="ratio"><span class="lab">Ratio</span><div class="select">
  ${['1:1','16 : 9','9:16','4:3','3:4'].map(r => `<span class="opt${f.ratio===r?' on':''}" data-act="ratio" data-v="${r}">${r}</span>`).join('')}</div></div>`;
const variants = (f) => `<div class="row"><span class="lab">Variants</span><div class="seg">
  ${[1,2,3,4].map(n => `<span class="opt${f.variants===n?' on':''}" data-act="variants" data-v="${n}">${n}</span>`).join('')}</div></div>`;
const pose = (f) => `<div class="pose-group">${toggle('Pose','pose',f.pose)}<div class="seg wide">
  ${['A-Pose','T-Pose'].map(p => `<span class="opt${f.pose && f.poseType===p?' on':''}" data-act="posetype" data-v="${p}">${p}</span>`).join('')}</div></div>`;
const genBtn = (f) => `<div class="gen${f.text.trim()?'':' off'}${S.busy?' busy':''}" data-act="generate"><span>${S.busy?'Generating…':'Generate'}</span></div>`;

const form2d = (f) => `
  <div class="content"><div class="content-inner">
    <div style="display:flex;flex-direction:column;gap:16px;width:100%">
      <div style="display:flex;flex-direction:column;gap:8px;width:100%"><p class="sect-title">${titleOf(S.cat)}</p>${tabs()}</div>
      <div class="form">
        ${promptBox(f, 'Describe the image or UI you want to create')}
        ${refbox(f)}
        ${ratio(f)}${variants(f)}
        ${toggle('Nine-slice','nineSlice',f.nineSlice)}${toggle('Transparent background','transparent',f.transparent)}
      </div>
    </div>
    ${genBtn(f)}
  </div></div>`;

const form3d = (f) => `
  <div class="content"><div class="content-inner">
    <div style="display:flex;flex-direction:column;gap:16px;width:100%">
      <div style="display:flex;flex-direction:column;gap:8px;width:100%"><p class="sect-title">${titleOf(S.cat)}</p>${tabs()}</div>
      <div class="form">
        ${promptBox(f, 'Describe the 3D object you want to create')}
        ${refbox(f)}
        ${toggle('Split','split',f.split)}${toggle('Texture','texture',f.texture)}
        ${pose(f)}
      </div>
    </div>
    ${genBtn(f)}
  </div></div>`;

const badge = (kind) => `<span class="badge ${kind==='2D'?'d2':'d3'}">${kind}</span>`;
const card = (item, kind, opts={}) => {
  const done = item.status === 'done';
  return `<div class="card${done?' done':''}" data-id="${item.id}">
    <div class="thumb"${done?` data-act="open" data-v="${item.id}"`:''}>
      ${done ? I(itemArt(item).thumb,92,85,`class="dog${item.fresh?' reveal':''}"`) : I('loading.gif',40,40,'class="spin"') + `<div class="prog"><i style="width:${item.progress||0}%"></i></div>`}
      ${opts.badge ? badge(kind) : ''}
      ${done ? `<div class="hover">${I('favorite.svg',20,20,`class="fav${item.fav?' on':''}" data-act="fav" data-v="${item.id}" title="Favorite"`)}${I('add-circle-brand.svg',24,24,`data-act="addscene" data-v="${item.id}" title="Add to scene"`)}</div>` : ''}
    </div>
    <p class="name${done?'':' dim'}${opts.lg?' lg':''}">${done ? esc(item.name) : 'Generating...'}</p></div>`;
};
const rows = (items, n, render) => { const out=[]; for (let i=0;i<items.length;i+=n) out.push(`<div class="cards">${items.slice(i,i+n).map(render).join('')}</div>`); return out.join(''); };

const assetsView = () => {
  const list = S.assets[S.cat];
  const kind = KINDS[S.cat];
  let body;
  if (!list.length) body = `<div class="empty-state">
      <img src="${U(S.cat === '2D & UI' ? 'cat-image.svg' : 'cat-asset.svg')}" alt="" class="ei">
      <p class="et">${S.cat === '2D & UI' ? 'No 2D assets yet' : S.cat === '3D Model' ? 'No 3D models yet' : 'No characters yet'}</p>
      <p class="eb">${S.cat === '2D & UI' ? 'Describe an image or UI in Generate and your results will show up here.' : 'Describe a 3D object in Generate and your models will show up here.'}</p>
      <div class="gen es" data-act="tab" data-v="gen"><span>Go to Generate</span></div></div>`;
  else if (kind === '2D') body = list.map(sec => `<div class="section">
      <div class="sec-head"><span class="d">${sec.date}</span><span class="t">${sec.time}</span><span class="t">${esc(sec.name)}</span>${badge('2D')}</div>
      ${rows(sec.items, 2, it => card(it, '2D'))}</div>`).join('');
  else body = `<div style="display:flex;flex-direction:column;gap:16px;width:100%">${list.map(sec => `<div class="cards pad">${sec.items.map(it => card(it, '3D', {badge:true, lg:true})).join('')}</div>`).join('')}</div>`;
  return `<div class="content assets"><p class="sect-title">${titleOf(S.cat)}</p><div class="assets-body">${tabs()}${body}</div></div>`;
};

const panelA = () => {
  const f = S.forms[S.cat];
  const body = S.tab === 'assets' ? assetsView() : (S.cat === '2D & UI' ? form2d(f) : form3d(f));
  return `<div class="panel" id="panel">${panelHead()}${cats()}${I('divider.svg',380,16,'class="divider"')}${body}</div>`;
};

/* ---------------- render ---------------- */
const stage = document.getElementById('stage');
function renderShell() { stage.innerHTML = topbar() + rail() + panel() + viewport() + chat(); renderScene(); }
function renderPanel() {
  const old = document.getElementById('panel');
  const scroll = old && old.querySelector('.assets-body') ? old.querySelector('.assets-body').scrollTop : 0;
  const tmp = document.createElement('div'); tmp.innerHTML = panel();
  old.replaceWith(tmp.firstElementChild);
  const nb = document.querySelector('#panel .assets-body'); if (nb) nb.scrollTop = scroll;
}
function toast(msg) {
  const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 1800);
}

/* ---------------- generation logic ---------------- */
let uid = 1;
function nameFromPrompt(text) {
  let s = text.trim().replace(/[.!。！]+$/, '');
  s = s.replace(/^(please\s+)?(i\s+(want|need|would like)\s+(to\s+)?)?(create|generate|make|build|draw|design)\s+(a|an|the|some)?\s*/i, '');
  s = s.replace(/^(a|an|the)\s+/i, '');
  if (!s) s = text.trim();
  s = s.charAt(0).toUpperCase() + s.slice(1);
  return s.length > 22 ? s.slice(0, 22).trim() + '…' : s;
}
function pad(n) { return String(n).padStart(2, '0'); }
function generate() {
  const f = S.forms[S.cat];
  if (!f.text.trim() || S.busy) return;
  const now = new Date();
  const kind = KINDS[S.cat];
  const name = nameFromPrompt(f.text);
  const n = kind === '2D' ? f.variants : 1;
  const items = Array.from({ length: n }, (_, i) => ({ id: uid++, status: 'generating', progress: 0,
    name: kind === '2D' ? `${name} ${pad(i + 1)}` : name, img: S.cat === '2D & UI' ? PUPPIES[i % PUPPIES.length] : undefined }));
  const section = { id: uid++, date: `${pad(now.getMonth() + 1)}-${pad(now.getDate())}`, time: `${pad(now.getHours())}:${pad(now.getMinutes())}`, name, kind, items };
  S.assets[S.cat].unshift(section);
  S.busy = true; S.tab = 'assets';
  renderPanel();
  const coins = document.getElementById('coins'); coins.textContent = Math.max(0, parseInt(coins.textContent, 10) - 10 * n);
  toast(`Generating ${n} ${kind} asset${n > 1 ? 's' : ''}…`);
  // simulated progress: each variant finishes ~0.9s after the previous one
  const start = performance.now();
  const durations = items.map((_, i) => 2200 + i * 900);
  const tick = () => {
    const t = performance.now() - start;
    let dirty = false, allDone = true;
    items.forEach((it, i) => {
      if (it.status === 'done') return;
      const p = Math.min(100, Math.round(t / durations[i] * 100));
      if (p !== it.progress) { it.progress = p; dirty = true; }
      if (p >= 100) { it.status = 'done'; it.fresh = true; dirty = true; }
      else allDone = false;
    });
    if (dirty) {
      // patch in place to keep the panel stable
      items.forEach(it => {
        const el = document.querySelector(`.card[data-id="${it.id}"]`);
        if (!el) return;
        if (it.status === 'done' && !el.classList.contains('done')) {
          const tmp = document.createElement('div'); tmp.innerHTML = card(it, kind, kind === '3D' ? { badge: true, lg: true } : {});
          el.replaceWith(tmp.firstElementChild); it.fresh = false;
        } else { const bar = el.querySelector('.prog i'); if (bar) bar.style.width = it.progress + '%'; }
      });
    }
    if (!allDone) requestAnimationFrame(tick);
    else { S.busy = false; toast(`${name} is ready in My Assets`); if (S.tab === 'gen') renderPanel(); const qq = new URLSearchParams(location.search); if (qq.get('detail')) openDetail(items[0].id); if (qq.get('add')) { addToScene(items[0]); } }
  };
  requestAnimationFrame(tick);
}



/* ---------------- scene objects: add to scene + edit state ---------------- */
let K = 1; // current stage scale, kept in sync by fit()
const gizmo = () => `<div class="gizmo"><svg width="180" height="180" viewBox="0 0 180 180" aria-hidden="true">
  <defs>
    <marker id="ax" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#ff5a6e"/></marker>
    <marker id="ay" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#c0f000"/></marker>
    <marker id="az" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#4f8dff"/></marker>
  </defs>
  <line x1="90" y1="90" x2="160" y2="90" stroke="#ff5a6e" stroke-width="3" marker-end="url(#ax)"/>
  <line x1="90" y1="90" x2="90" y2="20" stroke="#c0f000" stroke-width="3" marker-end="url(#ay)"/>
  <line x1="90" y1="90" x2="42" y2="138" stroke="#4f8dff" stroke-width="3" marker-end="url(#az)"/>
  <rect x="90" y="62" width="22" height="22" fill="rgba(255,255,255,.14)" stroke="rgba(255,255,255,.6)" stroke-width="1"/>
  <circle cx="90" cy="90" r="6" fill="#fff" stroke="#140e10" stroke-width="2"/>
</svg></div>`;
function renderScene() {
  const layer = document.getElementById('scene'); if (!layer) return;
  layer.innerHTML = S.scene.map(o => `<div class="obj${o.id === S.selected ? ' sel' : ''}${o.fresh ? ' placed' : ''}" data-oid="${o.id}" style="left:${o.x}px;top:${o.y}px;--h:${o.h}px">
      <div class="shadow"></div><img src="${U(o.img)}" draggable="false" alt="">
      ${o.id === S.selected ? `<div class="box"><i class="tl"></i><i class="tr"></i><i class="bl"></i><i class="br"></i><i class="tm"></i><i class="bm"></i><i class="ml"></i><i class="mr"></i></div><div class="tag"><b></b>${esc(o.name)}</div>${gizmo()}` : ''}
    </div>`).join('') + (S.selected ? `<div class="hint">Drag to move · Esc to deselect · Delete to remove</div>` : '');
  S.scene.forEach(o => { o.fresh = false; });
  const tools = document.querySelectorAll('.tb-center .tool');
  if (tools[2]) tools[2].classList.toggle('on', !!S.selected);
}
function addToScene(item) {
  const a = itemArt(item);
  const h = S.cat === 'Character' ? 340 : S.cat === '3D Model' ? 300 : 250;
  const n = S.scene.length;
  const o = { id: uid++, name: item.name, img: a.large, h, x: 546 + ((n % 3) - 1) * 120 + Math.floor(n / 3) * 24, y: 720 + (n % 3) * 12, fresh: true };
  S.scene.push(o); S.selected = o.id; renderScene();
}
let drag = null;
stage.addEventListener('pointerdown', (e) => {
  const obj = e.target.closest('.obj');
  if (obj) {
    const id = +obj.dataset.oid; const o = S.scene.find(s => s.id === id);
    if (S.selected !== id) { S.selected = id; renderScene(); }
    drag = { id, sx: e.clientX, sy: e.clientY, ox: o.x, oy: o.y, moved: false };

  S.thread.push({ role: 'user', text }); S.thread.push({ role: 'thinking' }); S.busy = true; renderChat();
  const cat = S.cat && GEN_TITLE[S.cat] ? S.cat : '3D Model';

let puppyN = 0;
function countFromText(text) { const m = text.match(/\b(2|3|4|two|three|four)\b/i); if (!m) return 1; return ({ two: 2, three: 3, four: 4 })[m[1].toLowerCase()] || parseInt(m[1], 10); }

/* ---- Character pipeline: concept image → (confirm or 10s) → 3D model + rig → animation ---- */
let cdTimer = null;

function continueTo3D(cid, auto) {

function regenConcept(cid) {

/* ---- Add Animation: Character Factory workspace in a modal + Edit Rig dialog ---- */
let AP = null; // { itemId, sel, showRig, rig: null | { step, x, y, z } }
const MOTIONS = { Basic: [['Idle','2.0s',[0,0]],['Walk','1.2s',[1,0]],['Run','0.8s',[2,0]],['Jump','1.4s',[3,0]]], Emotes: [['Clap','1.6s',[1,1]],['Victory','2.4s',[4,2]]] };
const tile = (n, d, i) => `<div class="mtile${AP.sel === n ? ' on' : ''}" data-act="apick" data-v="${n}" title="${n} · ${d}"><div class="mman" style="background-position:${i[0] * 100 / 6}% ${i[1] * 50}%"></div><span>${n}</span></div>`;
function renderAnim() {

    <div class="ahead"><p class="t">Add Animation · ${esc(it.short || it.name)}</p><div class="close" data-act="aclose" title="Close">${I('close.png',24,24)}</div></div>
    <div class="cfws">
      <div class="cfleft">
        <div class="cfmode"><div class="cfm">${I('cf-tab-model.svg',24,24)}<span>Model</span></div><div class="cfm on">${I('cf-tab-anim.svg',24,24)}<span>Anim</span></div></div>
        <div class="cfpanel">
          <p class="cfh">Rig</p>
          <div class="btn grey cfbtn" data-act="editrig">Edit Rig</div>

          <div class="cfdiv"></div>

          <div class="search cfsearch">${I('cf-search.svg',12,12)}<span>Search</span></div>
          ${Object.entries(MOTIONS).map(([g, list]) => `<p class="cfg">${g}</p><div class="mtiles">${list.map(([n, d, i]) => tile(n, d, i)).join('')}</div>`).join('')}
        </div>
      </div>
      <div class="cfplate">Character Factory</div>
      <div class="btn white cfapply" data-act="aapply">Apply ${esc(sel)}</div>
      <div class="cfstage">
        <div class="cfchar anim-${sel.toLowerCase()}" id="cfchar">${I(sel ? 'cat-turn.webp' : 'cat-turn-poster.png',340,414,'class="cfimg"')}${AP.showRig ? `<img src="${U('cf-rig.svg')}" class="cfrigimg" alt="">` : ''}</div>
        <p class="cfcap">${sel ? `Previewing <b>${esc(sel)}</b> · ${dur ? dur[1] : ''} loop · press Apply to use it` : 'Select animations for your character'}</p>
      </div>
      <div class="cfpipe"><span class="done">Text/Image</span><img src="${U('cf-arrow-a.svg')}" alt=""><span class="done">3D model</span><img src="${U('cf-arrow-b.svg')}" alt=""><span class="cur">Auto-Rig &amp; Animate</span><img src="${U('cf-arrow-a.svg')}" alt=""><span>Import to Game</span></div>
    </div>
  </div>
  ${AP.rig ? rigDlg(it) : ''}`);
}
const rigDlg = (it) => { const r = AP.rig; const rot = `rotateX(${r.x}deg) rotateY(${r.y}deg) rotateZ(${r.z}deg)`;
  return `<div class="overlay anim rig" data-act="rigclose"></div><div class="rigdlg" role="dialog" aria-label="Regenerate anims">
    <div class="rhead"><span>Regenerate anims</span><div class="close" data-act="rigclose">${I('close.png',24,24)}</div></div>

      ${r.step === 1 ? `<div class="rtip y">${I('warn-yellow.svg',24,24)}<span>Only humanoid animations are supported for now. Animations for other shapes will be available soon.</span></div>
      <div class="rtip">${I('warn-white.svg',24,24)}<span>Rotate the model so it stands upright and faces out of the screen (toward you), then continue.</span></div>` :
      `<div class="rtip">${I('warn-white.svg',24,24)}<span>Auto-rig found 18 joints. Drag a joint if it sits off the body, then finish.</span></div>`}
      <div class="rprev"><div class="rchar" style="transform:${rot}">${I('cat-turn-poster.png',300,340,'class="rimgc"')}${r.step === 2 ? `<img src="${U('cf-rig.svg')}" class="rrig" alt="">${[[50,22],[50,40],[30,42],[70,42],[16,50],[84,50],[42,70],[58,70],[42,92],[58,92]].map(([x, y]) => `<b class="joint" style="left:${x}%;top:${y}%"></b>`).join('')}` : ''}</div>
        </div>
      ${r.step === 1 ? `<div class="rsliders">${['x','y','z'].map(a => `<label class="rsl"><span>${a.toUpperCase()}<b>${r[a]}°</b></span><input type="range" min="-180" max="180" value="${r[a]}" data-axis="${a}"></label>`).join('')}<div class="rreset" data-act="rigreset" title="Reset">${I('reset.svg',36,48)}</div></div>` : ''}
    </div>
    <div class="rfoot">${r.step === 2 ? `<div class="btn grey" data-act="rigback">Back</div><div class="btn white" data-act="rigdone">Done</div>` : `<div class="btn grey" data-act="rigclose">Cancel</div><div class="btn white" data-act="rignext">Next</div>`}</div>
  </div>`; };
stage.addEventListener('input', (e) => { if (e.target.matches('.rsl input') && AP && AP.rig) { AP.rig[e.target.dataset.axis] = +e.target.value; const ch = stage.querySelector('.rchar'); if (ch) ch.style.transform = `rotateX(${AP.rig.x}deg) rotateY(${AP.rig.y}deg) rotateZ(${AP.rig.z}deg)`; const b = e.target.previousElementSibling.querySelector('b'); if (b) b.textContent = e.target.value + '°'; } });
document.addEventListener('keydown', (e) => { if (AP && e.key === 'Escape') { if (AP.rig) AP.rig = null; else AP = null; renderAnim(); } }, true);
function openAssetsChat() {
  if (S.chat !== 'assets') { S.chat = 'assets'; if (!S.chatNo) S.chatNo = 1; }
  S.menu = false; renderChat(); const ta = document.getElementById('cbInput'); if (ta) ta.focus();
}
stage.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]'); if (!el || !stage.contains(el)) return;

    case 'gkeep': { const m = S.thread.find(m => m.gallery && m.gallery.id === +v); if (m) { const keep = m.gallery.items[m.gallery.sel]; const drop = m.gallery.items.filter(it => it !== keep); S.lib = S.lib.filter(it => !drop.includes(it)); m.role = 'result'; m.item = keep; delete m.gallery; renderChat(); renderPanel(); toast(`Kept ${keep.name} · ${drop.length} variants removed from the library`); } break; }

function placeB(it) {

stage.addEventListener('input', (e) => { if (e.target.id === 'cbInput') syncSend(); });

document.addEventListener('pointerdown', (e) => { if (S.menu && !e.target.closest('.chat-head')) { S.menu = false; renderChat(); } }, true);

/* ---------- URL hooks for review: ?step=1..7 reproduces the Figma flow frames ---------- */
(function () {
  const q = new URLSearchParams(location.search); const step = parseInt(q.get('step') || '0', 10);
